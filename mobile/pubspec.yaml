name: vibematch
description: VibeMatch - random video chat and matchmaking (v2).
publish_to: 'none'
version: 2.0.0+1

environment:
  sdk: ^3.9.0
  flutter: '>=3.35.0'

# Versions are the latest majors known when this was written. Run `flutter pub upgrade --major-versions`
# on a machine with the SDK, then `flutter analyze && flutter test` (see README).
dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_bloc: ^9.1.1
  go_router: ^16.0.0
  dio: ^5.9.0
  flutter_secure_storage: ^9.2.4
  shared_preferences: ^2.5.3
  socket_io_client: ^3.1.2
  flutter_webrtc: ^1.1.0
  in_app_purchase: ^3.2.3
  google_mobile_ads: ^6.0.0
  firebase_core: ^4.0.0
  firebase_auth: ^6.0.0
  firebase_messaging: ^16.0.0
  google_sign_in: ^6.3.0
  video_player: ^2.10.0
  image_picker: ^1.1.2
  country_picker: ^2.0.27
  permission_handler: ^12.0.1
  url_launcher: ^6.3.2
  webview_flutter: ^4.13.0
  flutter_svg: ^2.2.0
  uuid: ^4.5.1
  intl: ^0.20.2
  equatable: ^2.0.7

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  mocktail: ^1.0.4
  bloc_test: ^10.0.0
  http_mock_adapter: ^0.6.1
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/images/gateways/

flutter_icons:
  android: true
  ios: true
  image_path: "assets/images/logo.png"
