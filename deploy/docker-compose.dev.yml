# Local development: only the data services. Run the API with `npm run dev` in ../backend.
name: vibematch-dev
services:
  mongo:
    image: mongo:7
    command: ["--replSet", "rs0", "--bind_ip", "127.0.0.1"]
    ports: ["27017:27017"]
    healthcheck:
      test: >
        mongosh --quiet --eval
        "try { rs.status().ok } catch (e) { rs.initiate({_id:'rs0',members:[{_id:0,host:'127.0.0.1:27017'}]}).ok }"
      interval: 5s
      retries: 20
  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
